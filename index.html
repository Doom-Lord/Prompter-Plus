<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompter Plus</title>
<style>
  :root{
    --bg: rgba(10,10,11,0.55);
    --surface: rgba(255,255,255,0.05);
    --border: rgba(255,255,255,0.16);
    --border-strong: rgba(255,255,255,0.32);
    --text-white: #f6f6f3;
    --text-muted: #83838a;
    --accent-green: #A9DC76;
    --accent-yellow: #FFD866;
    --accent-purple: #AB9DF2;
    --accent-orange: #FC9867;
    --font-prompter: -apple-system, "Helvetica Neue", Arial, sans-serif;
    --font-ui: -apple-system, "SF Pro Text", system-ui, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:transparent; font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
  }
  #stage{ position:fixed; inset:0; }

  /* brand label */
  #brand{
    position:absolute; top:16px; left:20px; z-index:6;
    font-family:var(--font-ui); font-size:11px; letter-spacing:0.12em;
    text-transform:uppercase; color:var(--text-muted);
    display:flex; align-items:center; gap:8px;
    text-shadow:0 1px 6px rgba(0,0,0,0.8);
  }
  #brand .dot{ width:6px; height:6px; border-radius:50%; background:var(--accent-yellow); }
  #filename{ color:var(--text-muted); font-size:11px; }
  #home-btn{
    background:var(--bg); border:1px solid var(--border); color:var(--text-muted);
    border-radius:5px; font-size:10px; padding:4px 8px; cursor:pointer;
    font-family:var(--font-ui); letter-spacing:0.05em; text-transform:uppercase;
    margin-left:4px; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  #home-btn:hover{ color:var(--text-white); border-color:var(--text-white); }

  /* drop / empty state */
  #empty-state{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:10px; z-index:4;
    color:var(--text-muted); text-align:center; cursor:pointer;
    transition:opacity .15s ease; text-shadow:0 2px 10px rgba(0,0,0,0.85);
  }
  #empty-state b{ color:var(--text-white); font-size:16px; font-weight:600; }
  #empty-state span{ font-size:13px; max-width:320px; }
  #empty-state.hidden{ display:none; }

  #drop-glow{
    position:absolute; inset:14px; border:2px dashed var(--accent-green);
    border-radius:16px; z-index:8; pointer-events:none; opacity:0;
    transition:opacity .12s ease;
  }
  #drop-glow.active{ opacity:0.85; }

  /* margin guide lines + handles */
  .guide-line{ position:absolute; background:var(--border); pointer-events:none; z-index:3; }
  .guide-line.h{ left:0; right:0; height:1px; }
  .guide-line.v{ top:0; bottom:0; width:1px; }
  .guide-tick{ position:absolute; background:var(--border); pointer-events:none; z-index:3; }

  .handle{
    position:absolute; width:13px; height:13px; background:var(--text-white);
    transform:translate(-50%,-50%) rotate(45deg); border-radius:2px; z-index:7;
    cursor:grab; box-shadow:0 0 0 4px var(--bg);
  }
  .handle:active{ cursor:grabbing; }
  #guides.hidden .guide-line, #guides.hidden .guide-tick, #guides.hidden .handle{
    opacity:0; pointer-events:none;
  }
  .guide-line, .guide-tick, .handle{ transition:opacity .15s ease; }

  /* viewport + script text */
  #viewport{
    position:absolute; overflow:hidden; z-index:2;
  }
  #script{
    position:relative; will-change:transform;
    font-family:var(--font-prompter); font-weight:700; letter-spacing:0.01em;
    color:var(--text-white); line-height:1.5; text-align:center;
    font-size:40px; padding:2px 4px; outline:none;
    text-shadow:0 2px 12px rgba(0,0,0,0.9), 0 0 4px rgba(0,0,0,0.7);
  }
  #script.select-mode{ -webkit-user-select:text; user-select:text; cursor:text; }
  #script.scroll-mode{ -webkit-user-select:none; user-select:none; cursor:grab; }
  #script.scroll-mode.dragging{ cursor:grabbing; }
  #script h1{ font-size:1.3em; margin:0.6em 0 0.3em; }
  #script h2{ font-size:1.15em; margin:0.6em 0 0.3em; color:var(--text-muted); }
  #script h3{ font-size:1.05em; margin:0.5em 0 0.2em; color:var(--text-muted); }
  #script p{ margin:0 0 0.7em; }
  #script hr{ border:none; border-top:1px solid var(--border-strong); margin:1em 0; }

  /* control clusters */
  .ctrl-cluster{
    position:absolute; display:flex; align-items:center; gap:8px; z-index:9;
  }
  #top-right-ctrl{ top:16px; right:20px; }
  #bottom-right-ctrl{ bottom:20px; right:24px; }

  .chip{
    font-family:var(--font-ui); font-size:11px; padding:6px 10px; border-radius:6px;
    border:1px solid var(--border); background:var(--bg); color:var(--text-muted);
    cursor:pointer; letter-spacing:0.02em; white-space:nowrap;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  .chip.active{ border-color:var(--text-white); color:var(--text-white); background:rgba(255,255,255,0.1); }

  .swatch{
    width:20px; height:20px; border-radius:50%; cursor:pointer;
    border:2px solid rgba(0,0,0,0.25); box-shadow:0 0 0 1px rgba(255,255,255,0.15);
  }
  .swatch[data-c="green"]{ background:var(--accent-green); }
  .swatch[data-c="yellow"]{ background:var(--accent-yellow); }
  .swatch[data-c="purple"]{ background:var(--accent-purple); }
  .swatch[data-c="orange"]{ background:var(--accent-orange); }

  .clear-color{
    width:20px; height:20px; border-radius:50%; cursor:pointer;
    border:1px solid var(--border); background:var(--bg); color:var(--text-muted);
    display:flex; align-items:center; justify-content:center; font-size:12px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  .clear-color:hover{ color:var(--text-white); border-color:var(--text-white); }
  .swatch.disabled, .clear-color.disabled{ opacity:0.25; pointer-events:none; }

  /* library overlay */
  #library-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:30;
    display:flex; align-items:center; justify-content:center;
  }
  #library-overlay.hidden{ display:none; }
  #library-panel{
    width:min(460px, 88vw); max-height:70vh; background:#151517;
    border:1px solid var(--border); border-radius:12px; padding:22px;
    display:flex; flex-direction:column; gap:14px;
  }
  .lib-header{ display:flex; align-items:center; justify-content:space-between; }
  .lib-header h2{ font-size:16px; margin:0; color:var(--text-white); font-family:var(--font-ui); }
  #lib-close{
    background:none; border:none; color:var(--text-muted); font-size:18px;
    cursor:pointer; line-height:1;
  }
  #lib-close:hover{ color:var(--text-white); }
  #lib-list{ overflow-y:auto; display:flex; flex-direction:column; gap:6px; max-height:44vh; }
  .lib-row{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px;
    background:rgba(255,255,255,0.03); border:1px solid transparent; cursor:pointer;
  }
  .lib-row:hover{ background:rgba(255,255,255,0.07); }
  .lib-row.current{ border-color:var(--accent-yellow); }
  .lib-name{ color:var(--text-white); font-size:13px; flex-grow:1; font-family:var(--font-ui); }
  .lib-date{ color:var(--text-muted); font-size:11px; font-family:var(--font-ui); white-space:nowrap; }
  .lib-remove{
    background:none; border:none; color:var(--text-muted); font-size:16px; cursor:pointer;
    line-height:1; padding:2px 4px;
  }
  .lib-remove:hover{ color:#e6465a; }
  .lib-empty{ color:var(--text-muted); font-size:13px; padding:12px 4px; }
  #lib-new-btn{
    align-self:flex-start; background:var(--accent-yellow); color:#1a1206; border:none;
    padding:9px 16px; border-radius:7px; font-size:12.5px; font-weight:600; cursor:pointer;
    font-family:var(--font-ui);
  }

  .size-btn{
    width:26px; height:26px; border-radius:50%; border:1px solid var(--border);
    background:var(--bg); color:var(--text-white); cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:15px;
    line-height:1; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  .size-btn:hover{ background:rgba(255,255,255,0.1); }

  input[type="range"]{
    -webkit-appearance:none; width:130px; height:3px; background:var(--border);
    border-radius:3px; outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:var(--text-white); cursor:pointer;
  }
  #size-label{ font-family:var(--font-ui); font-size:10px; color:var(--text-muted); letter-spacing:0.05em; text-transform:uppercase; margin-right:2px; }

  #file-input{ display:none; }
</style>
</head>
<body>

<div id="stage">
  <div id="brand"><span class="dot"></span>Prompter Plus <span id="filename"></span><button id="home-btn">+ New / Home</button></div>

  <div id="empty-state">
    <b>Drop a .md script file anywhere to begin</b>
    <span>Or click here to browse for a file. Drag the diamond handles to position the text next to your lens, scroll or drag the script to move through it.</span>
  </div>
  <div id="drop-glow"></div>

  <div id="guides">
    <div class="guide-line h" id="line-top"></div>
    <div class="guide-line h" id="line-bottom"></div>
    <div class="guide-line v" id="line-left"></div>
    <div class="guide-line v" id="line-right"></div>
    <div class="guide-tick" id="tick-top"></div>
    <div class="guide-tick" id="tick-bottom"></div>
    <div class="guide-tick" id="tick-left"></div>
    <div class="guide-tick" id="tick-right"></div>
    <div class="handle" id="handle-top"></div>
    <div class="handle" id="handle-bottom"></div>
    <div class="handle" id="handle-left"></div>
    <div class="handle" id="handle-right"></div>
  </div>

  <div id="viewport">
    <div id="script" class="scroll-mode"></div>
  </div>

  <div class="ctrl-cluster" id="top-right-ctrl">
    <button class="chip" id="library-toggle">Library</button>
    <button class="chip" id="guides-toggle">Guides</button>
    <button class="chip active" id="align-toggle">Align: Center</button>
    <button class="chip" id="mode-toggle">Edit Script</button>
    <button class="clear-color disabled" id="clear-color-btn" title="Clear color">×</button>
    <div class="swatch disabled" data-c="green" title="Green"></div>
    <div class="swatch disabled" data-c="yellow" title="Yellow"></div>
    <div class="swatch disabled" data-c="purple" title="Purple"></div>
    <div class="swatch disabled" data-c="orange" title="Orange"></div>
  </div>

  <div class="ctrl-cluster" id="bottom-right-ctrl">
    <span id="size-label">Text Size</span>
    <button class="size-btn" id="size-minus">–</button>
    <input type="range" id="size-slider" min="20" max="90" value="40">
    <button class="size-btn" id="size-plus">+</button>
  </div>
</div>

<div id="library-overlay" class="hidden">
  <div id="library-panel">
    <div class="lib-header">
      <h2>Script Library</h2>
      <button id="lib-close">×</button>
    </div>
    <div id="lib-list"></div>
    <button id="lib-new-btn">+ New Script</button>
  </div>
</div>

<input type="file" id="file-input" accept=".md,.markdown,text/markdown,text/plain">

<script>
(function(){
  "use strict";

  var SCRIPT_KEY = "prompterplus_script_v1";
  var PREFS_KEY  = "prompterplus_prefs_v1";
  var LIBRARY_KEY = "prompterplus_library_v1";

  var stage = document.getElementById("stage");
  var scriptEl = document.getElementById("script");
  var viewportEl = document.getElementById("viewport");
  var emptyState = document.getElementById("empty-state");
  var dropGlow = document.getElementById("drop-glow");
  var fileInput = document.getElementById("file-input");
  var filenameEl = document.getElementById("filename");
  var homeBtn = document.getElementById("home-btn");

  var libraryToggle = document.getElementById("library-toggle");
  var libraryOverlay = document.getElementById("library-overlay");
  var libClose = document.getElementById("lib-close");
  var libList = document.getElementById("lib-list");
  var libNewBtn = document.getElementById("lib-new-btn");

  var guidesWrap = document.getElementById("guides");
  var guidesToggle = document.getElementById("guides-toggle");
  var modeToggle = document.getElementById("mode-toggle");
  var alignToggle = document.getElementById("align-toggle");
  var clearColorBtn = document.getElementById("clear-color-btn");
  var swatches = document.querySelectorAll(".swatch");

  var sizeSlider = document.getElementById("size-slider");
  var sizeMinus = document.getElementById("size-minus");
  var sizePlus = document.getElementById("size-plus");

  var lineTop = document.getElementById("line-top");
  var lineBottom = document.getElementById("line-bottom");
  var lineLeft = document.getElementById("line-left");
  var lineRight = document.getElementById("line-right");
  var tickTop = document.getElementById("tick-top");
  var tickBottom = document.getElementById("tick-bottom");
  var tickLeft = document.getElementById("tick-left");
  var tickRight = document.getElementById("tick-right");
  var handleTop = document.getElementById("handle-top");
  var handleBottom = document.getElementById("handle-bottom");
  var handleLeft = document.getElementById("handle-left");
  var handleRight = document.getElementById("handle-right");

  var colorMap = {
    green: "#A9DC76", yellow: "#FFD866", purple: "#AB9DF2", orange: "#FC9867"
  };

  var state = {
    margin: { top: 12, bottom: 12, left: 10, right: 10 },
    fontSize: 40,
    align: "center",
    guidesVisible: true,
    selectMode: false,
    scrollOffset: 0,
    currentId: null
  };

  // ---------- persistence ----------
  function loadPrefs(){
    try{ var raw = localStorage.getItem(PREFS_KEY); return raw ? JSON.parse(raw) : null; }
    catch(e){ return null; }
  }
  function savePrefs(){
    localStorage.setItem(PREFS_KEY, JSON.stringify({
      margin: state.margin, fontSize: state.fontSize,
      guidesVisible: state.guidesVisible, align: state.align
    }));
  }
  function loadScript(){
    try{ var raw = localStorage.getItem(SCRIPT_KEY); return raw ? JSON.parse(raw) : null; }
    catch(e){ return null; }
  }
  function persistScript(){
    localStorage.setItem(SCRIPT_KEY, JSON.stringify({
      html: scriptEl.innerHTML, name: filenameEl.textContent, id: state.currentId
    }));
    if(state.currentId){
      var lib = loadLibrary();
      var entry = lib.find(function(e){ return e.id === state.currentId; });
      if(entry){
        entry.html = scriptEl.innerHTML;
        entry.updatedAt = Date.now();
        saveLibrary(lib);
      }
    }
  }

  // ---------- library ----------
  function loadLibrary(){
    try{ var raw = localStorage.getItem(LIBRARY_KEY); return raw ? JSON.parse(raw) : []; }
    catch(e){ return []; }
  }
  function saveLibrary(list){
    localStorage.setItem(LIBRARY_KEY, JSON.stringify(list));
  }
  function uid(){
    return "f_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
  }
  function upsertLibraryEntry(name, html){
    var lib = loadLibrary();
    var existing = lib.find(function(e){ return e.name === name; });
    if(existing){
      existing.html = html;
      existing.updatedAt = Date.now();
      state.currentId = existing.id;
    } else {
      var entry = { id: uid(), name: name, html: html, updatedAt: Date.now() };
      lib.push(entry);
      state.currentId = entry.id;
    }
    saveLibrary(lib);
  }
  function goHome(){
    scriptEl.innerHTML = "";
    filenameEl.textContent = "";
    state.currentId = null;
    state.scrollOffset = 0;
    localStorage.removeItem(SCRIPT_KEY);
    emptyState.classList.remove("hidden");
    renderScroll();
  }
  function openFromLibrary(id){
    var lib = loadLibrary();
    var entry = lib.find(function(e){ return e.id === id; });
    if(!entry) return;
    scriptEl.innerHTML = entry.html;
    filenameEl.textContent = "— " + entry.name;
    state.currentId = entry.id;
    state.scrollOffset = 0;
    emptyState.classList.add("hidden");
    clampScroll();
    renderScroll();
    persistScript();
    closeLibrary();
  }
  function removeFromLibrary(id){
    var lib = loadLibrary().filter(function(e){ return e.id !== id; });
    saveLibrary(lib);
    if(state.currentId === id) goHome();
    renderLibraryList();
  }
  function closeLibrary(){ libraryOverlay.classList.add("hidden"); }
  function renderLibraryList(){
    var lib = loadLibrary().sort(function(a,b){ return b.updatedAt - a.updatedAt; });
    libList.innerHTML = "";
    if(lib.length === 0){
      libList.innerHTML = '<div class="lib-empty">No scripts yet — drop a .md file to add one.</div>';
      return;
    }
    lib.forEach(function(entry){
      var row = document.createElement("div");
      row.className = "lib-row" + (entry.id === state.currentId ? " current" : "");
      var d = new Date(entry.updatedAt);
      row.innerHTML = '<span class="lib-name"></span><span class="lib-date"></span><button class="lib-remove" title="Remove">×</button>';
      row.querySelector(".lib-name").textContent = entry.name;
      row.querySelector(".lib-date").textContent = d.toLocaleDateString() + " " + d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
      row.addEventListener("click", function(ev){
        if(ev.target.closest(".lib-remove")) return;
        openFromLibrary(entry.id);
      });
      row.querySelector(".lib-remove").addEventListener("click", function(ev){
        ev.stopPropagation();
        if(confirm('Remove "' + entry.name + '" from your library?')) removeFromLibrary(entry.id);
      });
      libList.appendChild(row);
    });
  }
  homeBtn.addEventListener("click", goHome);
  libraryToggle.addEventListener("click", function(){
    renderLibraryList();
    libraryOverlay.classList.remove("hidden");
  });
  libClose.addEventListener("click", closeLibrary);
  libNewBtn.addEventListener("click", function(){ goHome(); closeLibrary(); });

  // ---------- minimal markdown parser ----------
  function escapeHtml(s){
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function inline(text){
    text = escapeHtml(text);
    text = text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    text = text.replace(/\*(.+?)\*/g, "<em>$1</em>");
    return text;
  }
  function parseMarkdown(md){
    var lines = md.replace(/\r\n/g, "\n").split("\n");
    var html = "";
    var para = [];
    function flush(){
      if(para.length){ html += "<p>" + para.join("<br>") + "</p>"; para = []; }
    }
    lines.forEach(function(line){
      if(/^###\s+/.test(line)){ flush(); html += "<h3>" + inline(line.replace(/^###\s+/, "")) + "</h3>"; }
      else if(/^##\s+/.test(line)){ flush(); html += "<h2>" + inline(line.replace(/^##\s+/, "")) + "</h2>"; }
      else if(/^#\s+/.test(line)){ flush(); html += "<h1>" + inline(line.replace(/^#\s+/, "")) + "</h1>"; }
      else if(/^-{3,}\s*$/.test(line)){ flush(); html += "<hr>"; }
      else if(line.trim() === ""){ flush(); }
      else { para.push(inline(line)); }
    });
    flush();
    return html;
  }

  // ---------- loading files ----------
  function loadFile(file){
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      var html = parseMarkdown(String(e.target.result));
      scriptEl.innerHTML = html;
      filenameEl.textContent = "— " + file.name;
      emptyState.classList.add("hidden");
      state.scrollOffset = 0;
      upsertLibraryEntry(file.name, html);
      clampScroll();
      renderScroll();
      persistScript();
    };
    reader.readAsText(file);
  }

  ["dragenter","dragover"].forEach(function(evt){
    stage.addEventListener(evt, function(e){
      e.preventDefault(); e.stopPropagation();
      dropGlow.classList.add("active");
    });
  });
  ["dragleave","drop"].forEach(function(evt){
    stage.addEventListener(evt, function(e){
      e.preventDefault(); e.stopPropagation();
      if(evt === "dragleave" && e.target !== stage) return;
      dropGlow.classList.remove("active");
    });
  });
  stage.addEventListener("drop", function(e){
    e.preventDefault();
    var file = e.dataTransfer.files && e.dataTransfer.files[0];
    if(file) loadFile(file);
  });
  emptyState.addEventListener("click", function(){ fileInput.click(); });
  fileInput.addEventListener("change", function(){
    if(fileInput.files && fileInput.files[0]) loadFile(fileInput.files[0]);
  });

  // ---------- margins / guides ----------
  function renderMargins(){
    var m = state.margin;
    viewportEl.style.top = m.top + "%";
    viewportEl.style.bottom = m.bottom + "%";
    viewportEl.style.left = m.left + "%";
    viewportEl.style.right = m.right + "%";

    lineTop.style.top = m.top + "%";
    lineBottom.style.bottom = m.bottom + "%";
    lineLeft.style.left = m.left + "%";
    lineRight.style.right = m.right + "%";

    tickTop.style.cssText += "left:50%; top:" + m.top + "%; width:1px; height:16px; transform:translate(-50%,-50%);";
    tickBottom.style.cssText += "left:50%; bottom:" + m.bottom + "%; width:1px; height:16px; transform:translate(-50%,50%);";
    tickLeft.style.cssText += "top:50%; left:" + m.left + "%; height:1px; width:16px; transform:translate(-50%,-50%);";
    tickRight.style.cssText += "top:50%; right:" + m.right + "%; height:1px; width:16px; transform:translate(50%,-50%);";

    handleTop.style.left = "50%"; handleTop.style.top = m.top + "%";
    handleBottom.style.left = "50%"; handleBottom.style.top = (100 - m.bottom) + "%";
    handleLeft.style.top = "50%"; handleLeft.style.left = m.left + "%";
    handleRight.style.top = "50%"; handleRight.style.left = (100 - m.right) + "%";

    clampScroll();
    renderScroll();
  }

  function dragHandle(handleEl, onMove){
    handleEl.addEventListener("pointerdown", function(e){
      e.preventDefault();
      handleEl.setPointerCapture(e.pointerId);
      function move(ev){ onMove(ev.clientX, ev.clientY); }
      function up(){
        handleEl.removeEventListener("pointermove", move);
        handleEl.removeEventListener("pointerup", up);
        savePrefs();
      }
      handleEl.addEventListener("pointermove", move);
      handleEl.addEventListener("pointerup", up);
    });
  }
  dragHandle(handleTop, function(x, y){
    var pct = (y / window.innerHeight) * 100;
    state.margin.top = Math.max(2, Math.min(pct, 80 - state.margin.bottom));
    renderMargins();
  });
  dragHandle(handleBottom, function(x, y){
    var pct = ((window.innerHeight - y) / window.innerHeight) * 100;
    state.margin.bottom = Math.max(2, Math.min(pct, 80 - state.margin.top));
    renderMargins();
  });
  dragHandle(handleLeft, function(x, y){
    var pct = (x / window.innerWidth) * 100;
    state.margin.left = Math.max(2, Math.min(pct, 80 - state.margin.right));
    renderMargins();
  });
  dragHandle(handleRight, function(x, y){
    var pct = ((window.innerWidth - x) / window.innerWidth) * 100;
    state.margin.right = Math.max(2, Math.min(pct, 80 - state.margin.left));
    renderMargins();
  });

  guidesToggle.addEventListener("click", function(){
    state.guidesVisible = !state.guidesVisible;
    guidesWrap.classList.toggle("hidden", !state.guidesVisible);
    guidesToggle.classList.toggle("active", state.guidesVisible);
    savePrefs();
  });

  // ---------- edit / scroll mode ----------
  function setMode(editing){
    state.selectMode = editing;
    scriptEl.classList.toggle("select-mode", editing);
    scriptEl.classList.toggle("scroll-mode", !editing);
    scriptEl.contentEditable = editing ? "true" : "false";
    modeToggle.classList.toggle("active", editing);
    modeToggle.textContent = editing ? "Done Editing" : "Edit Script";
    swatches.forEach(function(sw){ sw.classList.toggle("disabled", !editing); });
    clearColorBtn.classList.toggle("disabled", !editing);
    if(editing){
      try{ document.execCommand("defaultParagraphSeparator", false, "p"); }catch(e){}
      scriptEl.focus();
    }
  }
  modeToggle.addEventListener("click", function(){ setMode(!state.selectMode); });

  // auto-save edits made directly in the browser (debounced)
  var editSaveTimer = null;
  scriptEl.addEventListener("input", function(){
    clearTimeout(editSaveTimer);
    editSaveTimer = setTimeout(persistScript, 400);
  });

  // ---------- alignment ----------
  function setAlign(align){
    state.align = align;
    scriptEl.style.textAlign = align;
    alignToggle.textContent = "Align: " + (align === "center" ? "Center" : "Left");
    alignToggle.classList.toggle("active", align === "center");
  }
  alignToggle.addEventListener("click", function(){
    setAlign(state.align === "center" ? "left" : "center");
    savePrefs();
  });

  // ---------- text size ----------
  function applySize(){
    scriptEl.style.fontSize = state.fontSize + "px";
    sizeSlider.value = state.fontSize;
    clampScroll();
    renderScroll();
  }
  sizeSlider.addEventListener("input", function(){
    state.fontSize = parseInt(sizeSlider.value, 10);
    applySize();
    savePrefs();
  });
  sizeMinus.addEventListener("click", function(){
    state.fontSize = Math.max(20, state.fontSize - 4);
    applySize(); savePrefs();
  });
  sizePlus.addEventListener("click", function(){
    state.fontSize = Math.min(90, state.fontSize + 4);
    applySize(); savePrefs();
  });

  // ---------- manual scroll: wheel + drag ----------
  function maxScroll(){
    return Math.max(0, scriptEl.scrollHeight - viewportEl.clientHeight);
  }
  function clampScroll(){
    state.scrollOffset = Math.max(0, Math.min(state.scrollOffset, maxScroll()));
  }
  function renderScroll(){
    scriptEl.style.transform = "translateY(" + (-state.scrollOffset) + "px)";
  }
  viewportEl.addEventListener("wheel", function(e){
    e.preventDefault();
    state.scrollOffset += e.deltaY;
    clampScroll();
    renderScroll();
  }, { passive:false });

  var dragging = false, dragStartY = 0, dragStartOffset = 0;
  scriptEl.addEventListener("pointerdown", function(e){
    if(state.selectMode) return;
    dragging = true;
    dragStartY = e.clientY;
    dragStartOffset = state.scrollOffset;
    scriptEl.classList.add("dragging");
    scriptEl.setPointerCapture(e.pointerId);
  });
  scriptEl.addEventListener("pointermove", function(e){
    if(!dragging) return;
    var delta = dragStartY - e.clientY;
    state.scrollOffset = dragStartOffset + delta;
    clampScroll();
    renderScroll();
  });
  scriptEl.addEventListener("pointerup", function(){
    dragging = false;
    scriptEl.classList.remove("dragging");
  });

  // ---------- color highlighting ----------
  function unwrapColorSpans(root){
    var spans = root.querySelectorAll ? root.querySelectorAll('span[style*="color"]') : [];
    spans.forEach(function(sp){
      var parent = sp.parentNode;
      while(sp.firstChild) parent.insertBefore(sp.firstChild, sp);
      parent.removeChild(sp);
    });
  }
  function getValidRange(){
    var sel = window.getSelection();
    if(!sel || sel.rangeCount === 0 || sel.isCollapsed) return null;
    var range = sel.getRangeAt(0);
    if(!scriptEl.contains(range.commonAncestorContainer)) return null;
    return { sel: sel, range: range };
  }
  function applyColor(hex){
    var r = getValidRange();
    if(!r) return;
    var frag = r.range.extractContents();
    unwrapColorSpans(frag);
    var span = document.createElement("span");
    span.style.color = hex;
    span.appendChild(frag);
    r.range.insertNode(span);
    r.sel.removeAllRanges();
    persistScript();
  }
  function clearColor(){
    var r = getValidRange();
    if(!r) return;
    var frag = r.range.extractContents();
    unwrapColorSpans(frag);
    r.range.insertNode(frag);
    r.sel.removeAllRanges();
    persistScript();
  }
  swatches.forEach(function(sw){
    sw.addEventListener("mousedown", function(e){ e.preventDefault(); });
    sw.addEventListener("click", function(){ applyColor(colorMap[sw.dataset.c]); });
  });
  clearColorBtn.addEventListener("mousedown", function(e){ e.preventDefault(); });
  clearColorBtn.addEventListener("click", clearColor);

  window.addEventListener("resize", function(){ renderMargins(); });

  // ---------- init ----------
  (function init(){
    var prefs = loadPrefs();
    if(prefs){
      state.margin = prefs.margin || state.margin;
      state.fontSize = prefs.fontSize || state.fontSize;
      state.guidesVisible = prefs.guidesVisible !== false;
      state.align = prefs.align || state.align;
    }
    var saved = loadScript();
    if(saved && saved.html){
      scriptEl.innerHTML = saved.html;
      filenameEl.textContent = saved.name || "";
      state.currentId = saved.id || null;
      emptyState.classList.add("hidden");
    }
    guidesWrap.classList.toggle("hidden", !state.guidesVisible);
    guidesToggle.classList.toggle("active", state.guidesVisible);
    setAlign(state.align);
    setMode(false);
    applySize();
    renderMargins();
  })();
})();
</script>
</body>
</html>
